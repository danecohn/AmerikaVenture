name: Publish Vigil Venture for six platforms
'on':
  pull_request:
    branches: [altstack/alpine-official-logo-20261023]
  push:
    branches:
    - altstack/alpine-official-logo-20261023
    paths:
    - .github/workflows/altstack-release.yml
    - amerika/**
    - assets/**
    - packaging/**
    - scripts/**
    - validation/**
    - start/**
    - build.py
    - requirements*.txt
    - upstream.json
    - release-notes.md
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: altstack-venture-release
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: windows-x64
          runner: windows-2025
          python_arch: x64
        - target: windows-arm64
          runner: windows-11-arm
          python_arch: arm64
        - target: macos-x64
          runner: macos-15-intel
          python_arch: x64
        - target: macos-arm64
          runner: macos-15
          python_arch: arm64
        - target: linux-x64
          runner: ubuntu-24.04
          python_arch: x64
        - target: linux-arm64
          runner: ubuntu-24.04-arm
          python_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        architecture: ${{ matrix.python_arch }}
    - name: Install Linux runtime libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0
        libdbus-1-3 libasound2t64 libgtk-3-0 libsecret-1-0
    - name: Build Vigil browser
      run: python scripts/build.py --target ${{ matrix.target }}
    - name: Launch browser on matching CPU
      run: python scripts/smoke.py --target ${{ matrix.target }}
    - name: Verify actual default search and new-tab destination
      run: python validation/runtime.py build/${{ matrix.target }}
    - uses: actions/upload-artifact@v7
      with:
        name: Venture-${{ matrix.target }}
        path: release/AltStackVenture-*
        if-no-files-found: error
    - uses: actions/upload-artifact@v7
      with:
        name: Venture-preview-${{ matrix.target }}
        path: release/smoke-*.png
        if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        pattern: Venture-*
        path: release
        merge-multiple: true
    - name: Publish all six packages together
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: altstack-venture-zen-v1.23.4b-4
      run: |
        set -euo pipefail
        test "$(find release -maxdepth 1 -type f -name 'AltStackVenture-*' ! -name '*.sha256' | wc -l)" -eq 6
        test "$(find release -maxdepth 1 -type f -name 'AltStackVenture-*.sha256' | wc -l)" -eq 6
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo 'Release exists; increment the version instead of replacing published packages.' >&2
          exit 1
        fi
        gh release create "$TAG" --draft --target "$GITHUB_SHA" --title 'Vigil Venture' --notes-file release-notes.md
        gh release upload "$TAG" release/AltStackVenture-*
        gh release edit "$TAG" --draft=false --prerelease
