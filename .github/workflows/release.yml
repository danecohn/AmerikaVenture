name: Build and publish Vigil Venture downloads
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: venture-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s test -v
      - id: version
        run: echo "tag=v$(python -c 'import json; print(json.load(open("upstream.json"))["version"])')-amerika.1" >> "$GITHUB_OUTPUT"
      - name: Prepare early access release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Vigil Venture · $TAG" --notes-file release-notes.md --prerelease
  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: windows-x64, runner: windows-2025}
          - {target: windows-arm64, runner: windows-11-arm}
          - {target: macos-x64, runner: macos-15-intel}
          - {target: macos-arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build branded package
        run: python scripts/build.py --target ${{ matrix.target }}
      - name: Smoke test on the matching CPU
        run: python scripts/smoke.py --target ${{ matrix.target }}
      - name: Publish verified package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" release/Venture-${{ matrix.target }}.* --clobber
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: venture-${{ matrix.target }}-validation
          path: release/smoke-*.png
          if-no-files-found: ignore
