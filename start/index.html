<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vigil Venture</title>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="goldengate.css">
<link rel="stylesheet" href="start.css">
</head>
<body class="vt vt-wallpaper">
<header class="vt-glass vt-toolbar bar">
  <a class="brand" href="./" aria-label="Vigil Venture home"><img src="favicon-32.png" width="28" height="28" alt=""><span>Vigil <b>Venture</b></span></a>
  <time id="clock" class="clock"></time>
</header>
<main>
  <section class="hero">
    <img class="app-icon" src="apple-touch-icon.png" width="96" height="96" alt="">
    <h1>Vigil Venture</h1>
    <p>A window to the web.</p>
    <form action="https://duckduckgo.com/" method="get" role="search">
      <input class="vt-field" name="q" type="search" aria-label="Search the web" placeholder="Search the web" autofocus autocomplete="off">
      <button class="vt-btn primary" type="submit">Search</button>
    </form>
  </section>
  <nav aria-label="Shortcuts" class="tiles">
    <a class="tile" href="https://www.wikipedia.org/"><span class="glyph" aria-hidden="true">W</span><b>Wikipedia</b><small>The free encyclopedia</small></a>
    <a class="tile" href="https://www.openstreetmap.org/"><span class="glyph" aria-hidden="true">M</span><b>OpenStreetMap</b><small>Maps made by people</small></a>
    <a class="tile" href="https://github.com/danecohn/MakOS"><span class="glyph" aria-hidden="true">K</span><b>Makk OS</b><small>Source on GitHub</small></a>
  </nav>
</main>
<footer>A product of VigilTech, <a href="https://vigiltech.org">vigiltech.org</a>. Vigil Venture for Makk OS.</footer>
<script src="start.js"></script>
</body>
</html>
